<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Éclat Studio — Catálogo de productos con búsqueda, filtros por categoría y precio, y administración del catálogo."
    />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://encrypted-tbn0.gstatic.com" />
    <link rel="dns-prefetch" href="https://http2.mlstatic.com" />
    <link rel="dns-prefetch" href="https://media.falabella.com" />
    <link rel="dns-prefetch" href="https://m.media-amazon.com" />
    <title>Éclat Studio — Catálogo de productos</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("estante-theme");
          var theme = stored === "dark" || stored === "light" ? stored : "light";
          document.documentElement.dataset.theme = theme;
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
